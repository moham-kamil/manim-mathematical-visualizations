[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-mathematical-visualizations"
version = "1.0.0"
description = "Mathematical animations by Mohamed Kamil, built with Python and Manim."
requires-python = ">=3.12,<3.13"
authors = [{name = "Mohamed Kamil"}]
dependencies = ["manim==0.19.0", "numpy==2.3.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["manim_portfolio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
